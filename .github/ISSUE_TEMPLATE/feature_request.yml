name: 功能建议
description: 提出新功能、交互改进或技术方案建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。请先搜索现有 Issue，确认该想法没有与当前项目目标冲突。

        大功能请描述问题和场景，而不只是实现方案。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个建议解决了什么实际使用问题？
      placeholder: 当我在 ... 的时候，我发现 ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望 FloatingWords 如何表现或实现？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      placeholder: 是否有其它更简单或更一致的做法？

  - type: dropdown
    id: area
    attributes:
      label: 相关区域
      options:
        - 阅读模式与计时
        - 评级与调度
        - 词书与导入
        - 字体与颜色
        - 悬浮窗与视觉
        - 设置界面
        - 数据与持久化
        - 开发工具 / 测试
        - 文档
        - 其他
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 小型改进
        - 中等功能
        - 较大的新功能或架构调整
        - 不确定
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: 确认
      options:
        - label: 我搜索过现有 Issue，未发现重复建议。
          required: true
        - label: 我理解这不是立即实现的承诺。
          required: true
