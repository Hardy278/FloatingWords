name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          # NuGet caching is intentionally disabled until the project has dependencies.

      - name: Restore
        run: dotnet restore FloatingWords.slnx

      - name: Build
        run: dotnet build FloatingWords.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test FloatingWords.slnx --configuration Release --no-build --verbosity normal
